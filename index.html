<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TripWaala"/>
<meta name="theme-color" content="#0f1923"/>
<title>TripWaala</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/*  DARK MODE (default)  */
:root{
  --bg:#0a0a0f;
  --bg2:#111118;
  --bg3:#18181f;
  --surface:#111118;
  --surface2:#18181f;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#f0f0f5;
  --text2:#9ca3af;
  --muted:#6b7280;
  --accent:#60A5FA;
  --accent-bg:rgba(96,165,250,0.1);
  --accent-border:rgba(96,165,250,0.2);
  --green:#34d399;
  --red:#FF6B6B;
  --overlay:rgba(0,0,0,0.7);
  --shadow:0 4px 20px rgba(0,0,0,0.3);
  --inp-bg:#18181f;
  --card-hover:#18181f;
  --handle:rgba(255,255,255,0.1);
  --placeholder:#4a5a6a;
  --itin-line:rgba(255,255,255,0.12);
  --itin-dot-border:#0a0a0f;
  --toggle-bg:#18181f;
  --toggle-icon:"sun";
}

/*  LIGHT MODE  */
.light{
  --bg:#f5f7fa;
  --bg2:#ffffff;
  --bg3:#eef0f4;
  --surface:#ffffff;
  --surface2:#f0f2f6;
  --border:rgba(0,0,0,0.08);
  --border2:rgba(0,0,0,0.14);
  --text:#0f172a;
  --text2:#475569;
  --muted:#94a3b8;
  --accent:#2563EB;
  --accent-bg:rgba(37,99,235,0.08);
  --accent-border:rgba(37,99,235,0.2);
  --green:#059669;
  --red:#dc2626;
  --overlay:rgba(0,0,0,0.4);
  --shadow:0 4px 20px rgba(0,0,0,0.1);
  --inp-bg:#f0f2f6;
  --card-hover:#e8ecf2;
  --handle:rgba(0,0,0,0.1);
  --placeholder:#94a3b8;
  --itin-line:rgba(0,0,0,0.1);
  --itin-dot-border:#f5f7fa;
  --toggle-bg:#e8ecf2;
  --toggle-icon:"moon";
}

html,body{height:100%;background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);overflow-x:hidden;transition:background 0.3s,color 0.3s}
#root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
input,button,select,textarea{font-family:'Nunito',sans-serif}
button{cursor:pointer}
input,textarea{color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
input:focus,textarea:focus{outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes floatIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.spinner{width:28px;height:28px;border:3px solid var(--accent-bg);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
.screen{display:flex;flex-direction:column;min-height:100vh;animation:fadeIn 0.3s ease;background:var(--bg)}
.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:200;animation:fadeIn 0.2s ease}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:16px 20px 48px;width:100%;max-width:480px;animation:slideUp 0.25s ease;max-height:92vh;overflow-y:auto;border-top:1px solid var(--border)}
.handle{width:40px;height:4px;background:var(--handle);border-radius:2px;margin:0 auto 18px}
.sheet-title{font-size:18px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:10px;color:var(--text)}
.lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin-bottom:8px;margin-top:14px;display:block}
.inp{width:100%;padding:12px 14px;border-radius:12px;background:var(--inp-bg);border:1.5px solid var(--border);color:var(--text);font-size:15px;font-weight:700;transition:border-color 0.15s}
.inp:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:20px}
.btn-ghost{flex:1;padding:14px;border-radius:14px;background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);font-size:14px;font-weight:800}
.btn-primary{flex:2;padding:14px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:900;transition:opacity 0.15s}
.btn-primary:disabled{opacity:0.35;cursor:not-allowed}
.exp-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px;animation:pop 0.2s ease;box-shadow:var(--shadow)}
.day-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.day-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.day-chip.dashed{border-style:dashed}
.tab-btn{padding:12px 0;margin-right:18px;font-size:11px;font-weight:800;border:none;background:none;cursor:pointer;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);border-bottom:2.5px solid transparent;transition:all 0.2s;white-space:nowrap}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.payer-grid{display:flex;gap:6px;flex-wrap:wrap}
.payer-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:1.5px solid var(--border);background:var(--inp-bg);font-size:10px;font-weight:800;color:var(--muted);min-width:54px;transition:all 0.15s}
.payer-btn.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.payer-btn.out{opacity:0.5}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#0f1923;flex-shrink:0}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:calc(min(480px,100vw) - 32px);padding:16px;border-radius:18px;background:var(--accent);border:none;font-size:15px;font-weight:900;color:#fff;box-shadow:0 8px 28px rgba(96,165,250,0.3);z-index:50;cursor:pointer}
.icon-grid{display:flex;flex-wrap:wrap;gap:6px}
.icon-btn{font-size:20px;padding:6px;border-radius:10px;border:2px solid transparent;background:var(--inp-bg);cursor:pointer;transition:all 0.12s}
.icon-btn.sel{border-color:var(--accent);background:var(--accent-bg)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px}
.emoji-btn{font-size:22px;padding:6px 8px;border-radius:12px;border:2px solid var(--border);background:var(--inp-bg);cursor:pointer}
.emoji-btn.sel{border-color:var(--accent);background:var(--accent-bg)}
.trip-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;text-align:left;width:100%;color:var(--text);margin-bottom:10px;transition:all 0.15s;box-shadow:var(--shadow)}
.trip-card:active{background:var(--card-hover)}
.sync-ok{background:var(--accent-bg);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.sync-ing{background:var(--accent-bg);color:var(--accent);font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;animation:pulse 1s ease-in-out infinite}
.per-head{margin-top:12px;background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:800;color:var(--green)}
/*  Vault  */
.doc-cat-pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s}
.doc-cat-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px;animation:pop 0.2s ease;cursor:pointer;width:100%;text-align:left;color:var(--text);box-shadow:var(--shadow)}
.doc-card:active{background:var(--card-hover)}
.doc-type-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.upload-zone{border:2px dashed var(--accent-border);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--accent-bg)}
.img-preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--bg);display:block}
.doc-viewer-overlay{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;animation:fadeIn 0.2s ease}
.doc-viewer-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.cat-btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-btn{padding:14px;border-radius:14px;border:2px solid var(--border);background:var(--inp-bg);color:var(--text);font-size:13px;font-weight:800;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all 0.15s}
.cat-btn.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.file-chip{display:flex;align-items:center;gap:10px;background:var(--inp-bg);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:8px}
/*  Notes  */
textarea{font-family:'Nunito',sans-serif;color:var(--text)}
textarea::placeholder{color:var(--placeholder)}
textarea:focus{outline:none;border-color:var(--accent)!important}
/*  Itinerary  */
.itin-timeline{position:relative;padding-left:22px}
.itin-timeline::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--itin-line)}
.itin-block{position:relative;margin-bottom:10px;animation:pop 0.2s ease}
.itin-dot{position:absolute;left:-19px;top:14px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--itin-dot-border);flex-shrink:0}
.itin-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;width:100%;text-align:left;color:var(--text);display:block;box-shadow:var(--shadow)}
.itin-chip{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px}
.itin-day-strip{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.itin-day-chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.itin-day-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-opt{padding:12px 6px;border-radius:14px;border:2px solid var(--border);background:var(--inp-bg);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;font-size:11px;font-weight:800;color:var(--muted)}
.type-opt.sel{border-color:currentColor}
/*  Theme toggle button  */
.theme-toggle{background:var(--toggle-bg);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:16px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:4px;color:var(--text);font-weight:700;font-size:12px}
.theme-toggle:hover{background:var(--surface2)}
</style>
</head>

import{getFirestore,doc,setDoc,getDoc,collection,query,where,onSnapshot,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const COLORS = ["#FF6B6B","#4ECDC4","#FFE66D","#A8E6CF","#C9B1FF"];
const ICONS  = ["🍽","🚕","🏨","🎡","🛒","🍺","☕","🎟","⛽","🛍","🎂","💊"];
const EMOJIS = ["✈","🏖","🏔","🎒","🚂","🛳","🏕","🌍","🎡","🏛"];
const IDX    = "tw-index";

// Document vault categories
const DOC_CATS = [
  {key:"all",    label:"All",          icon:"🗂"},
  {key:"id",     label:"IDs & Visas",  icon:"🪪"},
  {key:"permit", label:"Permits",      icon:"📋"},
  {key:"hotel",  label:"Hotels",       icon:"🏨"},
  {key:"flight", label:"Flights",      icon:"✈"},
  {key:"vehicle",label:"Vehicle",      icon:"🚗"},
  {key:"medical",label:"Medical",      icon:"💊"},
  {key:"other",  label:"Other",        icon:"📎"},
];
const CAT_COLORS = {id:"#FF6B6B",permit:"#FFE66D",hotel:"#4ECDC4",flight:"#60A5FA",vehicle:"#FF9F43",medical:"#A8E6CF",other:"#C9B1FF"};

// Itinerary block types
const ITIN_TYPES = [
  {key:"travel",  label:"Travel",   icon:"🚗", color:"#60A5FA"},
  {key:"flight",  label:"Flight",   icon:"✈",  color:"#60A5FA"},
  {key:"train",   label:"Train",    icon:"🚂", color:"#FFE66D"},
  {key:"hotel",   label:"Stay",     icon:"🏨", color:"#60A5FA"},
  {key:"place",   label:"Place",    icon:"📍", color:"#FF6B6B"},
  {key:"food",    label:"Food",     icon:"🍽", color:"#A8E6CF"},
  {key:"activity",label:"Activity", icon:"🎡", color:"#C9B1FF"},
  {key:"ferry",   label:"Ferry",    icon:"🛳", color:"#60A5FA"},
  {key:"note",    label:"Note",     icon:"📝", color:"#7a90a4"},
];

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}
function av(size,color,letter){
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${color};font-size:${Math.floor(size*0.38)}px">${letter}</div>`;
}
function fmtSize(bytes){
  if(bytes<1024)return bytes+"B";
  if(bytes<1048576)return (bytes/1024).toFixed(1)+"KB";
  return (bytes/1048576).toFixed(1)+"MB";
}

function blankTrip(id,name,emoji,friends){
  return{id,name,emoji:emoji||"✈",friends,days:["Day 1"],expenses:[],docs:[],itinerary:[],notes:[],trash:[],activityLog:[],updatedAt:Date.now()}
}

function settle(friends,expenses){
  const paid={},owed={};
  friends.forEach(f=>{paid[f]=0;owed[f]=0});
  expenses.forEach(e=>{
    const amt=Number(e.amount);
    const who=e.split&&e.split.length>0?e.split:friends;
    const sh=amt/who.length;
    if(paid[e.paidBy]!==undefined)paid[e.paidBy]+=amt;
    who.forEach(p=>{if(owed[p]!==undefined)owed[p]+=sh});
  });
  const bal=friends.map(f=>({name:f,b:paid[f]-owed[f]}));
  const neg=bal.filter(x=>x.b<-0.01).map(x=>({...x})).sort((a,b)=>a.b-b.b);
  const pos=bal.filter(x=>x.b>0.01).map(x=>({...x})).sort((a,b)=>b.b-a.b);
  const txns=[];let i=0,j=0;
  while(i<neg.length&&j<pos.length){
    const a=Math.min(-neg[i].b,pos[j].b);
    if(a>0.01)txns.push({from:neg[i].name,to:pos[j].name,amount:Math.round(a*100)/100});
    neg[i].b+=a;pos[j].b-=a;
    if(Math.abs(neg[i].b)<0.01)i++;
    if(Math.abs(pos[j].b)<0.01)j++;
  }
  return{paid,owed,txns};
}

async function fbSaveTrip(trip){
  // Strip large base64 data from docs for Firestore (1MB limit per doc)
  // Images are stored in the trip object but Firestore has size limits
  const toSave={...trip};
  if(toSave.docs&&toSave.docs.length>0){
    // Keep file metadata but trim dataUrls if too large
    const docsSize=JSON.stringify(toSave.docs).length;
    if(docsSize>800000){
      toSave.docs=toSave.docs.map(d=>({...d,files:(d.files||[]).map(f=>({name:f.name,type:f.type,size:f.size,dataUrl:f.dataUrl&&f.dataUrl.length>50000?"[stored locally - too large for sync]":f.dataUrl}))}));
    }
  }
  await setDoc(doc(db,"trips",toSave.id),toSave);
}
async function fbLoadTrip(id){
  const snap=await getDoc(doc(db,"trips",id));
  return snap.exists()?{...snap.data(),id:snap.id}:null;
}
function fbListenTrips(uid,cb){
  if(_tripsUnsub)_tripsUnsub();
  const q=query(collection(db,"trips"),where("members","array-contains",uid));
  _tripsUnsub=onSnapshot(q,snap=>{
    const trips=snap.docs.map(d=>({...d.data(),id:d.id}));
    cb(trips);
  });
}
function fbListenTrip(id,cb){
  return onSnapshot(doc(db,"trips",id),snap=>{
    if(snap.exists())cb({...snap.data(),id:snap.id});
  });
}

function setField(path,value){
  const keys=path.split(".");
  if(keys.length===1){_state[keys[0]]=value;return;}
  if(keys.length===2){_state[keys[0]]={..._state[keys[0]],[keys[1]]:value};return;}
  if(keys.length===3){
    const arr=[...(_state[keys[0]][keys[1]])];
    arr[parseInt(keys[2])]=value;
    _state[keys[0]]={..._state[keys[0]],[keys[1]]:arr};
  }
}

async function signInGoogle(){
  const provider=new GoogleAuthProvider();
  provider.setCustomParameters({prompt:"select_account"});
  const errDiv=document.getElementById("auth-err");
  if(errDiv){errDiv.textContent="Trying to sign in...";errDiv.style.color="#60A5FA";}
  try{
    await signInWithPopup(auth,provider);
  }catch(e){
    console.error("Popup error:",e.code,e.message);
    if(e.code==="auth/popup-blocked"||e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request"){
      if(errDiv){errDiv.textContent="Popup blocked — trying redirect...";errDiv.style.color="#FFE66D";}
      try{
        await signInWithRedirect(auth,provider);
      }catch(e2){
        if(errDiv){errDiv.textContent="Error: "+e2.code+" — "+e2.message;errDiv.style.color="#FF6B6B";}
      }
    } else {
      if(errDiv){errDiv.textContent="Error: "+e.code+" — "+e.message;errDiv.style.color="#FF6B6B";}
    }
  }
}

function handleGoogleBtn(){
  const btn=document.getElementById("google-btn");
  const err=document.getElementById("auth-err");
  if(btn){btn.disabled=true;btn.style.opacity="0.7";btn.textContent="Signing in...";}
  if(err){err.textContent="";err.style.color="#60A5FA";}
  signInGoogle().catch(e=>{
    if(btn){btn.disabled=false;btn.style.opacity="1";btn.textContent="Continue with Google";}
    if(err){err.textContent="Failed: "+e.message;err.style.color="#FF6B6B";}
  });
}

async function updateTrip(patch){
  if(!_state.trip)return;
  const updated={..._state.trip,...patch,updatedAt:Date.now()};
  _state.trip=updated;
  setState({syncing:true});
  try{
    await fbSaveTrip(updated);
  }catch(e){
    console.error("Save failed:",e);
    // Show error briefly but don't get stuck
    const errDiv=document.getElementById("save-err");
    if(errDiv){errDiv.textContent="⚠ Save failed — check connection";errDiv.style.display="block";setTimeout(()=>{errDiv.style.display="none"},4000);}
  }finally{
    setState({syncing:false});
  }
}

async function joinTrip(id){
  setState({showJoin:false,joinVal:""});
  const trip=await fbLoadTrip(id);

  const user=_state.user;
  if(!trip.members||!trip.members.includes(user.uid)){
    await fbSaveTrip({...trip,members:[...(trip.members||[]),user.uid]});
  }
  openTrip(id);
}

function handleJoinUrl(){
  const val=_state.joinVal.trim();
  let id=val;
  if(val.includes("?t="))id=new URLSearchParams(val.split("?")[1]).get("t")||val;
  id=id.replace(/[^a-z0-9]/g,"").slice(0,7);
  if(/^[a-z0-9]{7}$/.test(id))joinTrip(id);
  else alert("Could not find a valid trip ID. Paste the full share link.");
}

function copyShareLink(){
  const{trip}=_state;if(!trip)return;
  const url=window.location.origin+window.location.pathname+"?t="+trip.id;
  const copy=()=>{setState({copied:true});setTimeout(()=>setState({copied:false}),2500)};
  navigator.clipboard.writeText(url).then(copy).catch(()=>{
    const ta=document.createElement("textarea");ta.value=url;
    document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);copy();
  });
}

function applyTheme(theme){
  document.documentElement.className = theme === 'light' ? 'light' : '';
  document.body.className = theme === 'light' ? 'light' : '';
  const root = document.getElementById('root');
  if(root) root.className = theme === 'light' ? 'light' : '';
  // Update theme-color meta
  const tc = document.querySelector('meta[name="theme-color"]');
  if(tc) tc.content = theme === 'light' ? '#f5f7fa' : '#0a0a0f';
  localStorage.setItem('tw-theme', theme);
}
function toggleTheme(){
  const next = _state.theme === 'dark' ? 'light' : 'dark';

function logActivity(action, expense){
  const user=_state.user;

function addExpense(exp){
  const{editExpenseId,trip}=_state;
  if(editExpenseId){
    const old=trip.expenses.find(e=>e.id===editExpenseId);
    const expenses=trip.expenses.map(e=>e.id===editExpenseId?{...e,...exp,id:editExpenseId}:e);
    const activityLog=logActivity("edited",exp);
    updateTrip({expenses,activityLog});
  } else {
    const activityLog=logActivity("added",exp);
    updateTrip({expenses:[...trip.expenses,exp],activityLog});
  }
  setState({showAdd:false,editExpenseId:null,addForm:{icon:"🍽",desc:"",amount:"",paidBy:"",split:[]}});
}

// SOFT DELETE — moves to trash with 14-day lock
function delExpense(id){
  const{trip,user}=_state;
  const exp=trip.expenses.find(e=>e.id===id);
  if(!exp)return;
  const trashedItem={
    ...exp,
    deletedAt:Date.now(),
    deletedBy:user?.displayName||"Someone",
    expiresAt:Date.now()+(14*24*60*60*1000), // 14 days from now
  };
  const trash=[...(trip.trash||[]),trashedItem];
  const expenses=trip.expenses.filter(e=>e.id!==id);
  const activityLog=logActivity("deleted",exp);
  updateTrip({expenses,trash,activityLog});
}

// RESTORE from trash
function restoreExpense(id){
  const{trip}=_state;
  const item=trip.trash.find(t=>t.id===id);
  if(!item)return;
  // Clean up trash item fields before restoring
  const{deletedAt,deletedBy,expiresAt,...restored}=item;
  const expenses=[...trip.expenses,restored];
  const trash=trip.trash.filter(t=>t.id!==id);
  const activityLog=logActivity("restored",item);
  updateTrip({expenses,trash,activityLog});
}

// Auto-purge expired trash items (>14 days old) — called when opening trash
function purgeExpiredTrash(){
  const{trip}=_state;
  const now=Date.now();
  const trash=(trip.trash||[]).filter(t=>now<t.expiresAt);
  if(trash.length!==(trip.trash||[]).length) updateTrip({trash});
}

function openDocPicker(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*,application/pdf,.pdf";inp.multiple=true;
  inp.onchange=async(e)=>{
    const files=[...e.target.files];
    const loaded=await Promise.all(files.map(f=>new Promise(res=>{
      const r=new FileReader();
      r.onload=ev=>res({name:f.name,type:f.type,size:f.size,dataUrl:ev.target.result});
      r.readAsDataURL(f);
    })));
    setState({docForm:{...getState().docForm,files:[...getState().docForm.files,...loaded]}});
  };
  inp.click();
}

function openFile(dataUrl, name){
  try{
    // Convert dataUrl to blob and open in new tab
    const arr=dataUrl.split(',');
    const mime=arr[0].match(/:(.*?);/)[1];
    const bstr=atob(arr[1]);
    let n=bstr.length;
    const u8arr=new Uint8Array(n);
    while(n--){u8arr[n]=bstr.charCodeAt(n);}
    const blob=new Blob([u8arr],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.target='_blank';
    a.rel='noopener';
    a.click();
    // Also trigger download
    setTimeout(()=>URL.revokeObjectURL(url),10000);
  }catch(e){
    alert('Could not open file: '+e.message);
  }
}
function downloadFile(dataUrl, name){
  try{
    const a=document.createElement('a');
    a.href=dataUrl;
    a.download=name||'file';
    a.click();
  }catch(e){
    alert('Could not download: '+e.message);
  }
}
function openEditNote(note){setState({showAddNote:true,editNoteId:note.id,noteForm:{title:note.title,body:note.body}});}
function saveNote(){
  const{noteForm,editNoteId,trip,user}=_state;
  if(!noteForm.title.trim()&&!noteForm.body.trim())return;
  const notes=[...(trip.notes||[])];
  if(editNoteId){
    const idx=notes.findIndex(n=>n.id===editNoteId);
    if(idx>-1)notes[idx]={...notes[idx],title:noteForm.title,body:noteForm.body,updatedAt:Date.now()};
  } else {
    notes.unshift({id:uid(),title:noteForm.title||"Untitled",body:noteForm.body,
      createdBy:user?.displayName||"Someone",createdAt:Date.now(),updatedAt:Date.now()});
  }
  updateTrip({notes});
  setState({showAddNote:false,editNoteId:null,noteForm:{title:"",body:""}});
}
function delNote(id){updateTrip({notes:(_state.trip.notes||[]).filter(n=>n.id!==id)});}

  else if(phase==="home")html=renderHome();

  if(af){af.focus();const v=af.value;af.value="";af.value=v;}
}

window.addEventListener('unhandledrejection',function(e){showError('Promise error: '+(e.reason?.message||String(e.reason)));});

// Apply saved theme
try{ applyTheme(_state.theme); }catch(e){ console.error('theme:',e); }

// Boot
try{ render(); }catch(e){ showError('Render error: '+e.message); }

setTimeout(()=>{
  try{
    getRedirectResult(auth).catch(e=>{
      if(e.code!=="auth/no-current-user")console.error("Redirect error:",e);
    });
    onAuthStateChanged(auth, async user=>{
      if(!user){ setState({phase:"login",user:null}); return; }
      _state.user=user;
      fbListenTrips(user.uid, trips=>{
        const meta=trips.map(t=>({
          id:t.id,name:t.name,emoji:t.emoji||"✈",
          friendCount:(t.friends||[]).length,
          expenseCount:(t.expenses||[]).length,
          docCount:(t.docs||[]).length
        }));
        if(_state.phase==="home")setState({trips:meta});
        else _state.trips=meta;
      });
      const urlId=getTripIdFromUrl();
      if(urlId){ openTrip(urlId); }
      else { setState({phase:"home",user}); }
    });
  }catch(e){ showError('Boot error: '+e.message); }
},1800);

    <div style="font-size:13px;color:var(--muted);font-weight:600">Sab kuch ek jagah. Bas chalo! 🚀</div>
    <div class="spinner" style="margin-top:24px"></div>

}

function renderNewModal(){
  const f=_state.newForm;
  const vc=f.friends.filter(x=>x.trim()).length;
  const ok=f.name.trim()&&vc>=2;
  return `<div class="overlay" onclick="if(event.target===this)setState({showNew:false})">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">New Trip</div>
      <label class="lbl">Trip Name</label>
      <input class="inp" id="nf-name" placeholder="e.g. Goa 2025" value="${esc(f.name)}" oninput="setField('newForm.name',this.value)"/>
      <label class="lbl">Emoji</label>
      <div class="emoji-grid">
        ${EMOJIS.map(e=>`<button class="emoji-btn${f.emoji===e?" sel":""}" onclick="setState({newForm:{...getState().newForm,emoji:'${e}'}})">${e}</button>`).join("")}
      </div>
      <label class="lbl">Friends (min 2)</label>
      ${f.friends.map((fr,i)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        ${av(30,fr.trim()?COLORS[i]:"#2a3f52",fr.trim()?fr[0].toUpperCase():i+1)}
        <input class="inp" id="nf-fr-${i}" style="flex:1" placeholder="Friend ${i+1}${i<2?" (required)":""}" value="${esc(fr)}"
          oninput="setField('newForm.friends.${i}',this.value)"/>
      </div>`).join("")}
      <div class="row">
        <button class="btn-ghost" onclick="setState({showNew:false})">Cancel</button>
        <button class="btn-primary" onclick="const f=getState().newForm;const pals=f.friends.filter(x=>x.trim());if(f.name.trim()&&pals.length>=2)createTrip(f.name.trim(),f.emoji,pals);else alert('Add a trip name and at least 2 friends')">Create Trip</button>
      </div>
    </div>
  </div>`;
}

function renderJoinModal(){
  const{joinVal}=_state;
  const id=joinVal.includes("?")?new URLSearchParams(joinVal.split("?")[1]).get("t")||"":joinVal.trim();
  const ok=/^[a-z0-9]{7}$/.test(id)||joinVal.includes("?d=");
  return `<div class="overlay" onclick="if(event.target===this)setState({showJoin:false})">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">Join a Trip</div>
      <label class="lbl">Paste the shared link</label>
      <input class="inp" id="join-val" placeholder="Paste link here..." value="${esc(joinVal)}" oninput="setField('joinVal',this.value)"/>
      ${joinVal.length>3&&!ok?`<div style="color:#FF6B6B;font-size:12px;margin-top:6px;font-weight:700">Paste the full link your friend shared</div>`:""}
      <div class="row">
        <button class="btn-ghost" onclick="setState({showJoin:false})">Cancel</button>
        <button class="btn-primary" onclick="handleJoinUrl()">Join Trip</button>
      </div>
    </div>
  </div>`;
}

// ── Trip screen ────────────────────────────────────────────────────────
function renderTrip(){
  const{trip,tab,day,showAdd,showAddDoc,showAddItin,viewDoc,copied,editFriend,syncing,docCat,itinDay}=_state;
  if(!trip)return"";
  const dayExps=trip.expenses.filter(e=>e.day===trip.days[day]);
  const docs=trip.docs||[];
  const itin=trip.itinerary||[];

  return `<div class="screen">
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:10px;padding:16px 14px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10">
      <button onclick="goHome()" style="background:none;border:none;color:#60A5FA;font-size:14px;font-weight:800;padding:6px 10px;border-radius:10px">‹ Home</button>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">
        <span style="font-size:15px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px"
          onclick="const n=prompt('Rename trip:',getState().trip.name);if(n&&n.trim())updateTrip({name:n.trim()})">
          ${trip.emoji} ${esc(trip.name)}
        </span>
        <span class="${syncing?"sync-ing":"sync-ok"}">${syncing?"saving...":"● saved"}</span>
        <div id="save-err" style="display:none;font-size:10px;color:#FF6B6B;font-weight:700"></div>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <button onclick="toggleTheme()" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer">${_state.theme==='dark'?'☀️':'🌙'}</button>
        <button onclick="copyShareLink()" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--text)">
          ${copied?"✓ Copied!":"Share"}
        </button>
      </div>
    </div>

    <!-- Friends -->
    <div style="display:flex;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto">
      ${trip.friends.map((f,i)=>`
        <div style="display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:50px"
          onclick="setState({editFriend:getState().editFriend===${i}?null:${i}})">
          ${av(42,COLORS[i%COLORS.length],f[0].toUpperCase())}
          ${editFriend===i
            ?`<input style="font-size:10px;background:transparent;border:none;border-bottom:1.5px solid #60A5FA;color:var(--text);outline:none;width:50px;text-align:center;font-weight:700;font-family:Nunito,sans-serif"
                autofocus value="${esc(f)}" onclick="event.stopPropagation()"
                oninput="setField('trip',{...getState().trip})"
                onblur="const v=this.value.trim();if(v){const old=getState().trip.friends[${i}];const fr=[...getState().trip.friends];fr[${i}]=v;updateTrip({friends:fr,expenses:getState().trip.expenses.map(e=>e.paidBy===old?{...e,paidBy:v}:e)});}setState({editFriend:null})"/>`
            :`<span style="font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;max-width:50px;overflow:hidden;text-overflow:ellipsis;text-align:center">${esc(f)}</span>`
          }
        </div>`).join("")}
    </div>

    <!-- Tabs — 5 tabs -->
    <div style="display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto">
      <button class="tab-btn${tab==="expenses"?" active":""}" onclick="setState({tab:'expenses'})">💸 Expenses</button>
      <button class="tab-btn${tab==="settle"?" active":""}" onclick="setState({tab:'settle'})">🤝 Settle</button>
      <button class="tab-btn${tab==="itin"?" active":""}" onclick="setState({tab:'itin'})" style="${tab==="itin"?"color:#60A5FA;border-bottom-color:#60A5FA":""}">🗺 Plan</button>
      <button class="tab-btn${tab==="vault"?" active":""}" onclick="setState({tab:'vault'})" style="${tab==="vault"?"color:#60A5FA;border-bottom-color:#60A5FA":""}">🗄 Vault${docs.length>0?` <span style="background:var(--accent);color:#fff;border-radius:20px;padding:1px 6px;font-size:9px;margin-left:3px">${docs.length}</span>`:""}</button>
      <button class="tab-btn${tab==="notes"?" active":""}" onclick="setState({tab:'notes'})" style="${tab==="notes"?"color:#60A5FA;border-bottom-color:#60A5FA":""}">📝 Notes${(trip.notes||[]).length>0?` <span style="background:var(--accent);color:#fff;border-radius:20px;padding:1px 6px;font-size:9px;margin-left:3px">${(trip.notes||[]).length}</span>`:""}</button>
    </div>

    <!-- Content -->
    <div style="flex:1;padding:16px 16px 100px;overflow-y:auto">
      ${tab==="expenses"?renderExpenses(trip,day,dayExps):""}
      ${tab==="settle"?renderSettle(trip):""}
      ${tab==="itin"?renderItinerary(trip,itin,itinDay):""}
      ${tab==="vault"?renderVault(trip,docCat):""}
      ${tab==="notes"?renderNotes(trip):""}
    </div>

    ${tab==="expenses"?`<button class="fab" onclick="setState({showAdd:true,editExpenseId:null,addForm:{icon:'🍽',desc:'',amount:'',paidBy:'',split:[...getState().trip.friends]}})">+ Add Expense</button>`:""}
    ${tab==="itin"?`<button class="fab" style="background:#60A5FA;box-shadow:0 8px 28px rgba(96,165,250,0.3)" onclick="openAddItin(getState().itinDay)">+ Add to Day ${itinDay+1}</button>`:""}
    ${tab==="vault"?`<button class="fab" style="background:#60A5FA;box-shadow:0 8px 28px rgba(96,165,250,0.3)" onclick="setState({showAddDoc:true,docForm:{title:'',cat:'id',note:'',files:[]}})">+ Add Document</button>`:""}
    ${tab==="notes"?`<button class="fab" style="background:#60A5FA;box-shadow:0 8px 28px rgba(96,165,250,0.3)" onclick="openAddNote()">+ New Note</button>`:""}

    ${showAdd?renderAddModal():""}
    ${showAddDoc?renderAddDocModal():""}
    ${showAddItin?renderAddItinModal():""}
    ${_state.showAddNote?renderAddNoteModal():""}
    ${viewDoc?renderDocViewer(viewDoc):""}
    ${_state.showTrash?renderTrashModal():""}
    ${_state.showLog?renderLogModal():""}
  </div>`;
}

// ── Expenses tab ───────────────────────────────────────────────────────
function renderExpenses(trip,day,dayExps){
  const trashCount=(trip.trash||[]).length;
  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div style="display:flex;gap:8px;flex:1;overflow-x:auto;padding-bottom:4px">
        ${trip.days.map((d,i)=>`<button class="day-chip${day===i?" active":""}" onclick="setState({day:${i}})">${esc(d)}</button>`).join("")}
        <button class="day-chip dashed" onclick="addDay()">+ Day</button>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="purgeExpiredTrash();setState({showTrash:true})" title="Trash"
          style="position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer">
          🗑${trashCount>0?`<span style="position:absolute;top:-4px;right:-4px;background:#FF6B6B;color:#fff;border-radius:10px;font-size:9px;font-weight:800;padding:1px 5px;min-width:16px;text-align:center">${trashCount}</span>`:""}
        </button>
        <button onclick="setState({showLog:true})" title="Activity Log"
          style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:14px;cursor:pointer">
          📋
        </button>
      </div>
    </div>
    ${dayExps.length===0
      ?`<div style="text-align:center;padding:52px 0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="font-size:44px">🧾</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">No expenses for ${esc(trip.days[day])}</div>
          <div style="font-size:12px">Tap the button below to add one</div>
        </div>`
      :dayExps.map(e=>{
          const ppl=e.split&&e.split.length>0?e.split:trip.friends;
          const ph=(Number(e.amount)/ppl.length).toFixed(2);
          const custom=e.split&&e.split.length>0&&e.split.length<trip.friends.length;
          const fi=trip.friends.indexOf(e.paidBy);
          return `<div class="exp-card" style="cursor:pointer" onclick="openEditExpense(${JSON.stringify(e).replace(/"/g,'&quot;')})">
            <div style="width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${e.icon||"💰"}</div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
              <div style="font-size:14px;font-weight:800">${esc(e.desc)}</div>

        <span style="font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px">Note</span>

      ${images.length>0?`

        ${images.map((f,i)=>`
          <div style="margin-bottom:12px">
            <img src="${f.dataUrl}" class="img-preview" alt="${esc(f.name)}" onclick="this.style.maxHeight=this.style.maxHeight==='none'?'300px':'none'" style="cursor:zoom-in;max-height:300px"/>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
              <div style="font-size:11px;color:var(--muted);font-weight:600">${esc(f.name)} · ${fmtSize(f.size)}</div>
              <button onclick="downloadFile(${JSON.stringify(f.dataUrl)},${JSON.stringify(f.name)})" style="background:var(--surface2);color:#60A5FA;border:1px solid rgba(96,165,250,0.2);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer">⬇ Save</button>
            </div>
          </div>`).join("")}
      `:""}

      ${pdfs.length>0?`
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);margin:16px 0 10px">PDFs (${pdfs.length})</div>
        ${pdfs.map(f=>`
          <div style="background:var(--surface);border:1px solid rgba(96,165,250,0.1);border-radius:12px;padding:14px;display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <div style="font-size:28px;flex-shrink:0">📄</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div>
              <div style="font-size:11px;color:var(--muted)">${fmtSize(f.size)}</div>

            <div style="display:flex;gap:8px;flex-shrink:0">
              <button onclick="openFile(${JSON.stringify(f.dataUrl)},${JSON.stringify(f.name)})" style="background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;cursor:pointer">Open</button>
              <button onclick="downloadFile(${JSON.stringify(f.dataUrl)},${JSON.stringify(f.name)})" style="background:var(--surface2);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;cursor:pointer">⬇</button>
            </div>

// ── Itinerary tab ──────────────────────────────────────────────────────
function renderItinerary(trip,itin,activeDay){
  const days=trip.days;
  const dayBlocks=itin.filter(b=>b.dayIdx===activeDay).sort((a,b)=>{
    if(!a.time&&!b.time)return a.createdAt-b.createdAt;
    if(!a.time)return 1;if(!b.time)return -1;
    return a.time.localeCompare(b.time);
  });

  const dayLabel=days[activeDay]||("Day "+(activeDay+1));
  const accentColors=["#60A5FA","#34d399","#f472b6","#a78bfa","#fb923c","#facc15"];
  const ac=accentColors[activeDay%accentColors.length];

  return `
    <!-- Day selector strip -->
    <div class="itin-day-strip">
      ${days.map((d,i)=>`<button class="itin-day-chip${activeDay===i?" active":""}" onclick="setState({itinDay:${i}})">${d}</button>`).join("")}
      <button class="itin-day-chip" style="border-style:dashed" onclick="addItinDay()">+ Day</button>
    </div>

    <!-- Day hero card — clean dark card with accent border -->
    <div style="background:var(--surface);border:1px solid ${ac}33;border-radius:20px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden">
      <div style="position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:56px;opacity:0.06;line-height:1;pointer-events:none">🗺</div>

      <div style="font-size:24px;font-weight:900;color:var(--text);margin-bottom:14px;line-height:1.2">${esc(dayLabel)}</div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="background:${ac}15;border:1px solid ${ac}33;border-radius:12px;padding:8px 16px;text-align:center">
          <div style="font-size:20px;font-weight:900;color:${ac};line-height:1">${dayBlocks.length}</div>
          <div style="font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px">stops</div>

        <input value="${esc(trip.dayDates&&trip.dayDates[activeDay]||"")}"
          id="dd-${activeDay}"

          onblur="updateTrip({dayDates:(()=>{const dd=[...(getState().trip.dayDates||getState().trip.days.map(()=>''))];dd[${activeDay}]=document.getElementById('dd-${activeDay}')?.value||'';return dd;})()} )"
          placeholder="Add date (e.g. Dec 14)..."
          style="flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);font-size:13px;font-weight:700;font-family:Nunito,sans-serif"/>
      </div>
    </div>

    <!-- Timeline blocks -->
    ${dayBlocks.length===0
      ?`<div style="text-align:center;padding:48px 0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px">
          <div style="font-size:48px">🗺</div>
          <div style="font-size:15px;font-weight:700;color:var(--text)">Plan Day ${activeDay+1}</div>
          <div style="font-size:13px">Add places, stays, travel &amp; more below</div>
        </div>`
      :`<div class="itin-timeline">
          ${dayBlocks.map(b=>{
            const t=ITIN_TYPES.find(x=>x.key===b.type)||ITIN_TYPES[0];
            return `<div class="itin-block">
              <div class="itin-dot" style="background:${t.color}"></div>

                  <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
                      <span style="font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px;background:${t.color}18;color:${t.color}">${t.label}</span>
                      ${b.time?`<span style="font-size:11px;color:var(--muted);font-weight:700">⏰ ${esc(b.time)}</span>`:""}

            style="${itinForm.type===t.key?`border-color:${t.color};background:${t.color}18;color:${t.color}`:""}"
            onclick="setState({itinForm:{...getState().itinForm,type:'${t.key}'}})">
            <span style="font-size:20px">${t.icon}</span>${t.label}
          </button>`).join("")}
      </div>

      <label class="lbl">${selType.icon} Title *</label>
      <input class="inp" id="if-title" placeholder="${
        itinForm.type==="travel"?"e.g. Drive to Manali via NH3":
        itinForm.type==="flight"?"e.g. IndiGo 6E-204 DEL→GOA":
        itinForm.type==="hotel"?"e.g. The Beach Resort, North Goa":
        itinForm.type==="place"?"e.g. Dudhsagar Falls":
        itinForm.type==="food"?"e.g. Breakfast at Cafe Bhonsle":
        itinForm.type==="activity"?"e.g. Scuba diving session":
        itinForm.type==="train"?"e.g. Rajdhani Express 12951":
        "e.g. Title"
      }" value="${esc(itinForm.title)}"
        oninput="setField('itinForm.title',this.value)"/>

      <label class="lbl">⏰ Time (optional)</label>
      <input class="inp" id="if-time" type="time" value="${esc(itinForm.time)}"
        oninput="setField('itinForm.time',this.value)"
        style="color-scheme:dark"/>

      <label class="lbl">📌 Detail (optional)</label>
      <input class="inp" id="if-detail" placeholder="${
        itinForm.type==="travel"?"e.g. ~6 hrs, NH3, toll Rs.280":
        itinForm.type==="flight"?"e.g. Terminal 2, Seat 14A, PNR: ABC123":
        itinForm.type==="hotel"?"e.g. Check-in 2PM, Room 304, +91 99xxx":
        itinForm.type==="place"?"e.g. Entry Rs.50, closes at 6PM":
        "e.g. Extra details, address, contact..."
      }" value="${esc(itinForm.detail)}"
        oninput="setField('itinForm.detail',this.value)"/>

      <label class="lbl">📝 Note (optional)</label>
      <input class="inp" id="if-note" placeholder="e.g. Carry ID proof, wear comfortable shoes..."
        value="${esc(itinForm.note)}"
        oninput="setField('itinForm.note',this.value)"/>

      <div class="row">
        <button class="btn-ghost" onclick="setState({showAddItin:false})">Cancel</button>
        <button class="btn-primary"
          style="background:#60A5FA"
          onclick="
            const title=document.getElementById('if-title')?.value||getState().itinForm.title;
            if(!title.trim()){alert('Add a title');return;}
            setField('itinForm.title',title);
            setField('itinForm.time',document.getElementById('if-time')?.value||getState().itinForm.time);
            setField('itinForm.detail',document.getElementById('if-detail')?.value||getState().itinForm.detail);
            setField('itinForm.note',document.getElementById('if-note')?.value||getState().itinForm.note);
            saveItin()
          ">
          ${editItinId?"Save Changes":"Add to Itinerary"}
        </button>
      </div>
    </div>
  </div>`;
}

// ── Notes tab ──────────────────────────────────────────────────────────
function renderNotes(trip){
  const notes=trip.notes||[];
  const colors=["#1a2535","#1a2520","#251a20","#1e1a2a","#25201a"];
  const accents=["#60A5FA","#34d399","#f472b6","#a78bfa","#fb923c"];
  if(notes.length===0) return `
    <div style="text-align:center;padding:60px 0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px">
      <div style="font-size:52px">📝</div>
      <div style="font-size:15px;font-weight:700;color:var(--text)">No notes yet</div>
      <div style="font-size:13px">Tap below to write your first note</div>
      <div style="font-size:12px;color:#60A5FA;font-weight:700;margin-top:4px">Emergency contacts, packing list, reminders — anything!</div>
    </div>`;

  return notes.map((n,i)=>{
    const bg=colors[i%colors.length];
    const ac=accents[i%accents.length];
    const preview=n.body?n.body.slice(0,120)+(n.body.length>120?"...":""):"";
    const lines=n.body?n.body.split("\n").filter(l=>l.trim()).length:0;
    const dt=new Date(n.updatedAt||n.createdAt);
    const dateStr=dt.toLocaleDateString("en-IN",{day:"numeric",month:"short"});
    return `<div style="background:${bg};border:1px solid ${ac}22;border-radius:18px;padding:16px 18px;
      margin-bottom:12px;cursor:pointer;animation:pop 0.2s ease;position:relative"
      onclick="openEditNote(${JSON.stringify(n).replace(/"/g,'&quot;')})">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">
        <div style="font-size:15px;font-weight:900;color:var(--text);line-height:1.3">${esc(n.title||"Untitled")}</div>
        <button onclick="event.stopPropagation();if(confirm('Delete this note?'))delNote('${n.id}')"
          style="background:none;border:none;color:var(--placeholder);font-size:14px;padding:0 2px;flex-shrink:0">✕</button>
      </div>
      ${preview?`<div style="font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${esc(preview)}</div>`:""}
      <div style="display:flex;align-items:center;gap:10px;margin-top:10px">
        <span style="font-size:10px;background:${ac}18;color:${ac};border-radius:6px;padding:2px 8px;font-weight:800">${lines} line${lines!==1?"s":""}</span>
        <span style="font-size:10px;color:var(--placeholder);font-weight:600">${dateStr}</span>
        <span style="font-size:10px;color:var(--placeholder);font-weight:600">by ${esc(n.createdBy||"")}</span>
      </div>
    </div>`;
  }).join("");
}

function renderAddNoteModal(){
  const{noteForm,editNoteId}=_state;
  return `<div class="overlay" onclick="if(event.target===this)setState({showAddNote:false})">
    <div style="background:var(--surface);border-radius:24px 24px 0 0;padding:16px 20px 48px;width:100%;max-width:480px;animation:slideUp 0.25s ease;max-height:92vh;display:flex;flex-direction:column">
      <div style="width:40px;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;margin:0 auto 14px"></div>

      <!-- Title input -->
      <input id="nt-title" class="inp" placeholder="Note title..."
        value="${esc(noteForm.title)}"
        oninput="setField('noteForm.title',this.value)"
        style="font-size:18px;font-weight:900;background:transparent;border:none;border-bottom:1.5px solid rgba(255,255,255,0.08);border-radius:0;padding:8px 0;margin-bottom:12px;color:var(--text)"/>

      <!-- Body textarea -->
      <textarea id="nt-body"
        placeholder="Write your note here...&#10;&#10;Ideas: packing list, emergency contacts, hotel details, things to do, reminders..."
        oninput="setField('noteForm.body',this.value)"
        style="flex:1;min-height:280px;background:var(--surface2);border:1.5px solid var(--border);border-radius:14px;padding:14px;color:var(--text);font-size:14px;font-weight:600;line-height:1.7;resize:none;outline:none;font-family:Nunito,sans-serif">${esc(noteForm.body)}</textarea>

      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn-ghost" onclick="setState({showAddNote:false})">Cancel</button>
        <button class="btn-primary" style="background:var(--accent);color:#fff"
          onclick="
            setField('noteForm.title',document.getElementById('nt-title')?.value||getState().noteForm.title);
            setField('noteForm.body',document.getElementById('nt-body')?.value||getState().noteForm.body);
            saveNote()
          ">${editNoteId?"Save Changes":"Save Note"}</button>
        ${editNoteId?`<button class="btn-ghost" style="flex:0;padding:14px;color:#FF6B6B;border-color:rgba(255,107,107,0.2)"
          onclick="delNote('${editNoteId}');setState({showAddNote:false})">🗑</button>`:""}
      </div>
    </div>
  </div>`;
}

// ── Trash Modal ────────────────────────────────────────────────────────
function renderTrashModal(){
  const trip=_state.trip;
  const trash=trip.trash||[];
  const now=Date.now();
  const DAY=24*60*60*1000;

  return `<div class="overlay" onclick="if(event.target===this)setState({showTrash:false})">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">🗑 Deleted Expenses</div>
      <div style="font-size:12px;color:#FF6B6B;background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.2);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:700;line-height:1.5">
        🔒 Deleted expenses are kept for <b>14 days</b> and cannot be permanently deleted by anyone. They auto-remove after expiry.
      </div>
      ${trash.length===0
        ?`<div style="text-align:center;padding:40px 0;color:var(--muted)">
            <div style="font-size:40px;margin-bottom:8px">✅</div>
            <div style="font-size:14px;font-weight:700;color:var(--text)">Trash is empty</div>
            <div style="font-size:12px;margin-top:4px">No deleted expenses</div>
          </div>`
        :trash.map(t=>{
            const daysLeft=Math.ceil((t.expiresAt-now)/DAY);
            const deletedDate=new Date(t.deletedAt).toLocaleDateString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
            return `<div style="background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px">
              <div style="display:flex;align-items:flex-start;gap:10px">
                <div style="font-size:22px;flex-shrink:0">${t.icon||"💰"}</div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:14px;font-weight:800;color:var(--text)">${esc(t.desc)}</div>
                  <div style="font-size:12px;color:var(--muted);margin-top:2px">Rs.${Number(t.amount).toFixed(2)} · Paid by ${esc(t.paidBy)}</div>
                  <div style="font-size:11px;color:#FF6B6B;margin-top:4px;font-weight:700">Deleted by ${esc(t.deletedBy)} · ${deletedDate}</div>
                  <div style="font-size:11px;color:var(--muted);margin-top:2px">
                    ${daysLeft>0
                      ?`Auto-removes in <b style="color:#FFE66D">${daysLeft} day${daysLeft!==1?"s":""}</b>`
                      :"Expiring soon"
                    }
                  </div>
                </div>
                <button onclick="restoreExpense('${t.id}')"
                  style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:800;color:#34d399;cursor:pointer;flex-shrink:0;white-space:nowrap">
                  ↩ Restore
                </button>
              </div>
            </div>`;
          }).join("")
      }
      <button class="btn-ghost" style="width:100%;margin-top:8px" onclick="setState({showTrash:false})">Close</button>
    </div>
  </div>`;
}

// ── Activity Log Modal ─────────────────────────────────────────────────
function renderLogModal(){
  const trip=_state.trip;
  const log=trip.activityLog||[];
  const actionColor={added:"#34d399",edited:"#60A5FA",deleted:"#FF6B6B",restored:"#FFE66D"};
  const actionIcon={added:"➕",edited:"✏️",deleted:"🗑",restored:"↩"};

  return `<div class="overlay" onclick="if(event.target===this)setState({showLog:false})">
    <div class="sheet" style="max-height:80vh">
      <div class="handle"></div>
      <div class="sheet-title">📋 Activity Log</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:14px;font-weight:600">Shows last 100 expense actions by all members</div>
      ${log.length===0
        ?`<div style="text-align:center;padding:40px 0;color:var(--muted)">
            <div style="font-size:40px;margin-bottom:8px">📋</div>
            <div style="font-size:14px;font-weight:700;color:var(--text)">No activity yet</div>
            <div style="font-size:12px;margin-top:4px">Actions will appear here as expenses are added, edited or deleted</div>
          </div>`
        :log.map(l=>{
            const ac=actionColor[l.action]||"#6b7280";
            const ic=actionIcon[l.action]||"•";
            const timeStr=new Date(l.at).toLocaleDateString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
            return `<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
              <div style="width:30px;height:30px;border-radius:50%;background:${ac}18;border:1.5px solid ${ac}44;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${ic}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:13px;font-weight:800;color:var(--text)">
                  <span style="color:${ac}">${l.by}</span> ${l.action} an expense
                </div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px">${l.expenseIcon} ${esc(l.expenseDesc)} · Rs.${Number(l.expenseAmount).toFixed(2)}</div>
                <div style="font-size:11px;color:var(--placeholder);margin-top:2px">${timeStr}</div>
              </div>
            </div>`;
          }).join("")
      }
      <button class="btn-ghost" style="width:100%;margin-top:12px" onclick="setState({showLog:false})">Close</button>
    </div>
  </div>`;
}

// ── Add Expense Modal ──────────────────────────────────────────────────
function renderAddModal(){
  const{addForm,trip,editExpenseId}=_state;
  const isEdit=!!editExpenseId;
  const ph=addForm.amount&&addForm.split.length?(parseFloat(addForm.amount)/addForm.split.length).toFixed(2):null;
  const currentDay=trip.days[_state.day];
  return `<div class="overlay" onclick="if(event.target===this)setState({showAdd:false,editExpenseId:null})">
    <div class="sheet">
      <div class="handle"></div>
      <div class="sheet-title">${isEdit?"✏️ Edit Expense":"Add Expense"} <span style="font-size:12px;background:#60A5FA;color:#fff;padding:3px 10px;border-radius:20px;font-weight:800">${esc(currentDay)}</span></div>
      <label class="lbl">Category</label>
      <div class="icon-grid">
        ${ICONS.map(ic=>`<button class="icon-btn${addForm.icon===ic?" sel":""}" onclick="setState({addForm:{...getState().addForm,icon:'${ic}'}})">${ic}</button>`).join("")}
      </div>
      <label class="lbl">Description</label>
      <input class="inp" id="af-desc" placeholder="e.g. Lunch at the beach" value="${esc(addForm.desc)}"
        oninput="setField('addForm.desc',this.value)"/>
      <label class="lbl">Amount (Rs.)</label>
      <input class="inp" id="af-amt" type="number" placeholder="0.00" value="${addForm.amount}"
        oninput="setField('addForm.amount',this.value)"/>
      <label class="lbl">Paid by</label>
      <div class="payer-grid">
        ${trip.friends.map((f,i)=>`<button class="payer-btn${addForm.paidBy===f?" sel":""}"
          onclick="setState({addForm:{...getState().addForm,paidBy:'${esc(f)}'}})">
          ${av(26,COLORS[i%COLORS.length],f[0])}${esc(f)}
        </button>`).join("")}
      </div>
      <label class="lbl">Split between <span style="font-size:10px;text-transform:none;letter-spacing:0;font-weight:600">(tap to exclude)</span></label>
      <div class="payer-grid">
        ${trip.friends.map((f,i)=>{
          const on=addForm.split.includes(f);
          return `<button class="payer-btn${on?" sel":" out"}"
            onclick="const s=[...getState().addForm.split];const idx=s.indexOf('${esc(f)}');if(idx>-1)s.splice(idx,1);else s.push('${esc(f)}');setState({addForm:{...getState().addForm,split:s}})">
            ${av(26,on?COLORS[i%COLORS.length]:"#555",f[0])}
            <span style="color:${on?"inherit":"#888"}">${esc(f)}</span>
            ${!on?`<span style="font-size:8px;color:#666;font-weight:800;text-transform:uppercase">out</span>`:""}
          </button>`;
        }).join("")}
      </div>
      ${ph?`<div class="per-head">Rs.${ph} each × ${addForm.split.length} people${addForm.split.length<trip.friends.length?` <span style="color:var(--muted);font-weight:600">— ${trip.friends.filter(f=>!addForm.split.includes(f)).join(", ")} excluded</span>`:""}</div>`:""}
      <div class="row">
        <button class="btn-ghost" onclick="setState({showAdd:false,editExpenseId:null})">Cancel</button>
        <button class="btn-primary" onclick="
          const f=getState().addForm;
          const desc=document.getElementById('af-desc')?.value||f.desc;
          const amt=document.getElementById('af-amt')?.value||f.amount;
          if(!desc||!amt||!f.paidBy||!f.split.length){alert('Fill in description, amount and who paid');return;}
          addExpense({id:'${uid()}',icon:f.icon,desc:desc,amount:parseFloat(amt),paidBy:f.paidBy,day:'${esc(currentDay)}',split:f.split})
        ">${isEdit?"Save Changes":"Add Expense"}</button>
      </div>
    </div>
  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────
// (render and boot are defined above)
// ─────────────────────────────────────────────────────────────────────────

</script>
</body>
</html>
